name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          # pnpm 11.8.0 requires Node >= 22.13 (node:sqlite); Node 20 fails at
          # `pnpm store path` before any project step runs.
          node-version: 22
          cache: pnpm
      - name: Install the pinned DSH baseline
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm install -g @deepseek-ai/dsh@0.2.1-rc.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Unit tests
        run: pnpm test:windows
